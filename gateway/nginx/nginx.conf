worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging structuré JSON
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":"$status",'
            '"bytes_sent":"$bytes_sent",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"user_agent":"$http_user_agent",'
            '"x_request_id":"$http_x_request_id",'
            '"trace_id":"$http_traceparent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting — zones
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=order_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ws_zone:10m    rate=20r/m;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream — microservices
    upstream service_user        { server service-user:8001;        keepalive 32; }
    upstream service_restaurant  { server service-restaurant:8002;  keepalive 32; }
    upstream service_menu        { server service-menu:8003;        keepalive 32; }
    upstream service_reservation { server service-reservation:8004; keepalive 32; }
    upstream service_order       { server service-order:8005;       keepalive 32; }
    upstream service_payment     { server service-payment:8006;     keepalive 32; }
    upstream service_delivery    { server service-delivery:8007;    keepalive 32; }
    upstream service_loyalty     { server service-loyalty:8008;     keepalive 32; }
    upstream service_notification{ server service-notification:8009;keepalive 32; }
    upstream service_analytics   { server service-analytics:8010;   keepalive 32; }
    upstream frontend            { server frontend:3000;            keepalive 16; }

    # Headers de sécurité communs
    map $upstream_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'none';";
    }

    # ─── Serveur principal ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Redirection HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        # TLS 1.3
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Headers de sécurité globaux
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Content-Security-Policy $csp_header always;

        # Request ID pour la corrélation des logs
        add_header X-Request-ID $request_id always;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Headers proxy communs
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # ── Auth endpoints (rate limit strict) ──────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://service_user;
        }

        # ── Users ──────────────────────────────────────────────────────────────
        location /api/v1/users/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass http://service_user;
        }

        # ── Restaurants ────────────────────────────────────────────────────────
        location /api/v1/restaurants/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_cache_valid 200 30s;
            proxy_pass http://service_restaurant;
        }

        # ── Menus ──────────────────────────────────────────────────────────────
        location /api/v1/menus/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_pass http://service_menu;
        }

        # ── Reservations ───────────────────────────────────────────────────────
        location /api/v1/reservations/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass http://service_reservation;
        }

        # ── Orders (rate limit plus strict) ────────────────────────────────────
        location /api/v1/orders/ {
            limit_req zone=order_zone burst=10 nodelay;
            proxy_pass http://service_order;
        }

        # ── Payments (stripe webhook sans rate limit IP) ────────────────────────
        location /api/v1/payments/webhooks/ {
            proxy_pass http://service_payment;
        }
        location /api/v1/payments/ {
            limit_req zone=order_zone burst=5 nodelay;
            proxy_pass http://service_payment;
        }

        # ── Deliveries ─────────────────────────────────────────────────────────
        location /api/v1/deliveries/ {
            limit_req zone=api_global burst=30 nodelay;
            proxy_pass http://service_delivery;
        }

        # ── Loyalty ────────────────────────────────────────────────────────────
        location /api/v1/loyalty/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass http://service_loyalty;
        }

        # ── Notifications ──────────────────────────────────────────────────────
        location /api/v1/notifications/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass http://service_notification;
        }

        # ── Analytics (admin uniquement) ───────────────────────────────────────
        location /api/v1/analytics/ {
            limit_req zone=api_global burst=10 nodelay;
            proxy_pass http://service_analytics;
        }

        # ── WebSocket — Menu (disponibilité temps réel) ─────────────────────────
        location /ws/menus {
            limit_req zone=ws_zone burst=10 nodelay;
            proxy_pass http://service_menu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── WebSocket — Delivery (GPS temps réel) ──────────────────────────────
        location /ws/deliveries {
            limit_req zone=ws_zone burst=10 nodelay;
            proxy_pass http://service_delivery;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── WebSocket — Notifications ───────────────────────────────────────────
        location /ws/notifications {
            limit_req zone=ws_zone burst=10 nodelay;
            proxy_pass http://service_notification;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── Frontend Next.js ────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
        }

        # ── Health check gateway (sans logs) ───────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Métriques Nginx (Prometheus nginx-prometheus-exporter) ─────────────
        location /nginx_status {
            stub_status;
            allow 172.0.0.0/8;
            deny all;
        }
    }
}
