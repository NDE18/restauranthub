      ports:
        - port: 5432
---
# PostgreSQL service-payment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-payment-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: postgres-payment
  policyTypes:
    - Ingress
  ingress:
