# NetworkPolicies pour les composants d'infrastructure
# Chaque base de données n'accepte que les connexions de son service

---
# PostgreSQL service-user
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-user-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: postgres-user
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-user
      ports:
        - port: 5432
---
# PostgreSQL service-order
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-order-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: postgres-order
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
