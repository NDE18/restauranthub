---
# MongoDB service-menu
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-menu-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: mongo-menu
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-menu
      ports:
