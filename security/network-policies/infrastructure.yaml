---
# Redis — accessible par plusieurs services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - service-user
                  - service-menu
                  - service-order
                  - service-loyalty
                  - service-payment
                  - service-reservation
                  - service-notification
      ports:
        - port: 6379
---
# Kafka — accessible par tous les services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - service-user
                  - service-menu
                  - service-order
                  - service-loyalty
                  - service-payment
                  - service-delivery
                  - service-reservation
                  - service-notification
                  - service-analytics
      ports:
        - port: 29092
    # Zookeeper → Kafka
    - from:
        - podSelector:
            matchLabels:
              app: zookeeper
      ports:
        - port: 29092
---
# Zookeeper
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zookeeper-policy
  namespace: restaurant
spec:
  podSelector:
    matchLabels:
      app: zookeeper
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 2181
