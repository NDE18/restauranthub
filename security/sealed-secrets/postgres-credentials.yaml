# Exemple de SealedSecret — les valeurs encryptedData sont des placeholders.
# Pour generer un vrai SealedSecret :
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=username=postgres \
#     --from-literal=password=SuperSecr3t! \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: restaurant
spec:
  encryptedData:
    username: AgBy3i4PLACEHOLDER_RUN_KUBESEAL_TO_GENERATE_REAL_VALUES
    password: AgCE8jPLACEHOLDER_RUN_KUBESEAL_TO_GENERATE_REAL_VALUES
  template:
    metadata:
      name: postgres-credentials
      namespace: restaurant
    type: Opaque
