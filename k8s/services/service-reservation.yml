apiVersion: v1
kind: ConfigMap
metadata:
  name: service-reservation-config
  namespace: restaurant
data:
  DB_NAME: reservation_db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-reservation
  namespace: restaurant
spec:
  clusterIP: None
  selector:
    app: postgres-reservation
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-reservation
  namespace: restaurant
spec:
  serviceName: postgres-reservation
  replicas: 1
  selector:
    matchLabels:
      app: postgres-reservation
  template:
    metadata:
      labels:
        app: postgres-reservation
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: reservation_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi 
---
# service-reservation Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-reservation
  namespace: restaurant
  labels:
    app: service-reservation
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-reservation
  strategy:
    type:  RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-reservation 
        version: v1
    spec:
      containers:
        - name: service-reservation
          image: ghcr.io/nde18/restauranthub/service-reservation:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: postgres-reservation
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 15
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-reservation
  namespace: restaurant
spec:
  selector:
    app: service-reservation
  ports:
    - port: 8080
      targetPort: http
      name: http         