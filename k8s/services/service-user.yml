apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-user
  namespace: restaurant
  labels:
    app: service-user
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-user
        version: v1
    spec:
      containers:
        - name: service-user
          image: ghcr.io/nde18/restauranthub/service-user:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: postgres-user
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-user
  namespace: restaurant
spec:
  selector:
    app: service-user
  ports:
    - port: 8080
      targetPort: http
      name: http
