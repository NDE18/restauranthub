apiVersion: v1
kind: ConfigMap
metadata:
  name: service-menu-config
  namespace: restaurant
data:
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-menu
  namespace: restaurant
  labels:
    app: service-menu
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-menu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-menu
        version: v1
    spec:
      containers:
        - name: service-menu
          image: service-menu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: service-menu-config
          env:
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo-menu:27017/menu_db?authSource=admin"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-menu
  namespace: restaurant
spec:
  selector:
    app: service-menu
  ports:
    - port: 3000
      targetPort: http
      name: http
