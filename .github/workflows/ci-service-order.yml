name: CI - service-order

on:
    push:
        branches:
            -   main
        paths:
            -   'services/service-order/**'
            -   'shared/contracts/events/user-events.json'

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: nde18/restauranthub/service-order
    JAVA_VERSION: '21'
    SERVICE_PATH: services/service-order

permissions:
    contents: read
    packages: write
    security-events: write

jobs:
    # ---------- Lint + Tests ---------------
    test:
        name: Lint & Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.SERVICE_PATH }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup JDK ${{ env.JAVA_VERSION }}
                uses: actions/setup-java@v4
                with:
                    java-version: ${{ env.JAVA_VERSION }}
                    distribution: temurin
                    cache: maven
            
            -   name: Lint
                run: mvn checkstyle:check -q || true

            -   name: Tests unitaires
                run: mvn verify -q

            -   name: UPload test reports
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-reports-service-order
                    path: ${{ env.SERVICE_PATH }}/target/surefire-reports/
                    retention-days: 7

    # --------------- Build Push image Docker ------------------
    build-image:
        name: Build & Push Image
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'ref/heads/main'

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                    tags: | 
                        type=sha,prefix=sha-,format=short
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=ref,event=pr

            -   name: Build and push
                uses: docker/build-push-action@v6
                with:
                    context: ${{ env.SERVICE_PATH }}
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

    # -------------------- Scan de sécurité ---------------------
    security-scan:
        name: Security Scan (Trivy)
        runs-on: ubuntu-latest
        needs: build-image

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Run Trivy vulnerability scanner
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                    format: 'sarif'
                    output: 'trivy-results.sarif'
                    severiry: 'CRITICAL,HIGH'

            -   name: Upload Trivy scan results
                uses: github/codeql-action/upload-sarif@v3
                if: always()
                with:
                    sarif_file: 'trivy-results.sarif'